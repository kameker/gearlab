name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test geometry and STEP/STL round trips
        run: python -m pytest tests/test_geometry.py -q --basetemp=build-test-tmp --junitxml=test-results.xml
      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm GearLab.spec
      - name: Package portable release
        run: python package_release.py --output release
      - uses: actions/upload-artifact@v4
        with:
          name: GearLab-Windows
          path: |
            release/GearLab-Windows.zip
            release/GearLab-source.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GearLab-Windows
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release/GearLab-Windows.zip release/GearLab-source.zip \
              release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" \
              release/GearLab-Windows.zip release/GearLab-source.zip \
              release/SHA256SUMS.txt --title "GearLab $RELEASE_TAG" \
              --generate-notes
          fi
